queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci
      - '-files ~= ^protected/'
    merge_conditions:
      - check-success = ci
    merge_method: squash
    batch_size: 2
merge_protections_settings:
  auto_merge_conditions: true
merge_protections:
  - name: eligible PRs land only through the queue
    if:
      - base = main
      - '-files ~= ^protected/'
    success_conditions:
      - queue-position >= 0
