queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci
      - check-success = pr-only
      - status-success = review-gate
      - '-files ~= ^protected/'
    merge_conditions:
      - check-success = ci
    merge_method: squash
    batch_size: 2
    branch_protection_injection_mode: none
    merge_bot_account: xiechimon
merge_protections_settings:
  auto_merge_conditions: true
